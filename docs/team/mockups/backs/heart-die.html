<!-- The Wager back (approved 23 Oct) with its two generic pip dice replaced by the game's Heart die (T13, Astra: three visible faces,
coherent cube geometry, the game's real number-and-symbol arrangement). Faces from js/gfx/dice/dice.js:45 (1 heal, 2 pierce, 3 magic,
4 gold, 5 block, 6 attack) and the cube layout from js/gfx/dice/poly.js:135 (1 +Y, 2 +Z, 3 +X, 4 -X, 5 -Z, 6 -Y; opposite pairs
1/6, 2/5, 3/4). Seen with 6 toward us and 3 on the left (as in assets/tutorial/heart-6.png), the third visible face is 5 on top.
The die is CSS 3D, so the cube is a true cube; this page is rendered once to back-wager.webp. -->
