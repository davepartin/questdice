<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONCEPT · one card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="card.css">
<style>.pg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px 16px;background:radial-gradient(90% 50% at 50% 35%,#221a14,#0b0a0a 65%,#04060d)}
.concept{padding:4px 10px;border-radius:4px;font:800 .6rem Oxanium;letter-spacing:.2em;background:#b3261e;color:#fff}
.qc{--w:min(340px,calc(100vw - 24px))}.under{width:min(340px,calc(100vw - 24px))}.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts .btn{height:54px;line-height:1.1}.acts small{display:block;font-size:.72rem;text-transform:none;opacity:.85}</style></head><body>
<main class="pg"><div class="concept">CONCEPT · rendered from live game data</div><div id="slot"></div><div class="under"><div class="acts"><div class="btn go" id="a1">Take</div><div class="btn no" id="a2"></div></div></div></main>
<script type="module">
import { renderCard, weaponData, objectiveData } from './card-template.js';
const p = new URLSearchParams(location.search); const kind = p.get('kind') || 'weapon';
if (kind === 'weapon') { const d = weaponData(p.get('id') || 'dagger', +(p.get('metal') ?? 1), +(p.get('size') || 6)); slot.append(renderCard('weapon', d)); a2.innerHTML = `Sell<small>for ${d.sell} gold</small>`; }
else { const d = objectiveData(p.get('id') || 'nopotion', +(p.get('act') || 2)); slot.append(renderCard('objective', d)); a1.textContent = `Bet ${d.stake} gold`; a2.textContent = 'Decline'; }
document.body.dataset.ready = 1;
</script></body></html>
