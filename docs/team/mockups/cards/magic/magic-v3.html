<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic panel v3 tweaks (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Crockpot (Grok Bot), 25 Oct 7:19 PM CT, Dave approved direction, for Claude. A static redraw of Claude's live tile panel (build t21c) with 3 tweaks:
 1) cost moves to a strip under the name (icons fully visible); 2) two fonts only: Cinzel for titles, Inter for all UI, fixed size/weight scale;
 3) the selected tile and the detail panel share one gold border (tab-to-panel). ?sel=arcbolt|heal  ?low=1 shows a greyed "Need N more" tile. -->
<style>
:root{--line:#d9b46a;--bg:#1c1526;--panel:#241a31;--tile:#17202c;--mag:#a77bff;--t1:18px;--t2:15px;--ui:13px;--sm:11.5px}
*{box-sizing:border-box}body{margin:0;background:#0b0a10;font:500 var(--ui)/1.35 Inter,system-ui,sans-serif;color:#efe7f7;-webkit-font-smoothing:antialiased}
.sheet{margin:10px;border:1.5px solid #6b5636;border-radius:16px;background:radial-gradient(120% 60% at 50% 0,#2b2140,#141019);padding:14px 12px 12px;height:calc(100svh - 190px);display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0;font:700 var(--t1) Cinzel;letter-spacing:.06em;color:#f1e3c4}
.close{font:700 var(--sm) Inter;letter-spacing:.08em;color:#fff;background:#221c2a;border:1px solid #5b4a6e;border-radius:10px;padding:9px 12px}
.pools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.pool{border:1px solid #3d3150;border-radius:10px;padding:8px 12px;display:flex;align-items:baseline;gap:6px;background:#1a1424}
.pool b{font:800 20px Inter}.pool small{font:600 var(--sm) Inter;color:#b8a9c8;letter-spacing:.04em}
.tri{display:inline-block;width:.85em;height:.75em;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.row{display:grid;grid-template-columns:repeat(3,1fr) 6px repeat(3,1fr);gap:6px;align-items:stretch;position:relative;z-index:2}
.sep{align-self:stretch;margin:8px 0 10px;border-left:1px solid #4a3d5c}
.t{border:1.5px solid #3a3446;border-radius:10px;background:var(--tile);padding:8px 3px 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;overflow:hidden}
.t .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#3b2a1a,#1a120c);box-shadow:0 0 0 2px #b48a4a}
.t .ic svg{width:24px;height:24px}
.t .nm{font:700 var(--sm)/1.15 Inter;text-align:center;min-height:2.3em;display:flex;align-items:center}
.t .cost{margin-top:auto;align-self:stretch;text-align:center;font:800 var(--sm) Inter;color:#fff;background:#4a2f7d;padding:4px 0;display:flex;justify-content:center;align-items:center;gap:4px}
.t .cost.free{background:#1f6b45}.t .pips{font-size:9px;letter-spacing:2px;color:#ff6b7a;margin-top:-2px}
.t.sel{border-color:var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel);margin-bottom:-1.5px;padding-bottom:1.5px}
.t.sel .cost{background:#6a44b8}
.t.off{opacity:.55;filter:grayscale(.6)}.t.off .cost{background:#5a4a40}
.panel{position:relative;z-index:1;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;flex:1;display:flex;flex-direction:column;gap:8px}
.panel.first{border-top-left-radius:0}
.kick{font:700 var(--sm) Inter;letter-spacing:.1em;color:#c8a6ff;text-transform:uppercase}
.panel h2{margin:0;font:700 var(--t1) Cinzel;color:#f6eaff}.panel .rule{font:600 var(--sm) Inter;color:#b8a9c8}
.panel p{margin:4px 0 0;font:500 var(--t2)/1.45 Inter}
.ctl{margin-top:auto;display:flex;gap:8px;align-items:stretch}
.step{display:flex;border:1px solid #4a3d5c;border-radius:10px;overflow:hidden}.step button{width:44px;border:0;background:#2a2036;color:#fff;font:700 18px Inter}.step b{width:40px;display:grid;place-items:center;font:800 18px Inter;background:#120e18}
.cast{flex:1;border:0;border-radius:10px;background:linear-gradient(#9a6cf0,#6f43c9);color:#fff;padding:9px 10px;text-align:left;display:flex;align-items:center;gap:10px}
.cast b{display:block;font:800 var(--t2) Inter}.cast small{display:block;font:600 var(--sm) Inter;opacity:.9}
.dock{margin:0 10px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.dock div{border:1px solid #333;border-radius:10px;text-align:center;padding:6px 0;font:800 18px Inter}.dock small{display:block;font:700 9px Inter;letter-spacing:.08em;opacity:.8}
.bar{margin:10px;display:grid;grid-template-columns:1fr 1.15fr 1.6fr;gap:8px}.bar div{border-radius:12px;padding:14px 8px;font:800 13px Inter;text-align:center;color:#fff}
.note{position:absolute;left:10px;right:10px;bottom:6px;font:600 10px Inter;color:#8c7f9c;text-align:center}
</style></head><body>
<div class="sheet"><div class="hd"><h1>Magical Powers</h1><span class="close">✕ CLOSE</span></div>
<div class="pools"><div class="pool" style="color:#c9a8ff"><span class="tri"></span><b id="mg">12</b><small>/ 19 MAGIC</small></div><div class="pool" style="color:#6fe39a"><b>✚ 46</b><small>/ 56</small></div></div>
<div class="row" id="row"></div><div class="panel" id="panel"></div></div>
<div class="dock"><div style="color:#ff4b4b;border-color:#7a2020">5<small>ATTACK</small></div><div style="color:#777">0<small>PIERCE</small></div><div style="color:#4aa8ff;border-color:#1f4f80">11<small>BLOCK</small></div><div style="color:#b98cff;border-color:#4a2f7d">4<small>MAGIC</small></div><div style="color:#49e08a;border-color:#1f6b45">10<small>HEAL</small></div><div style="color:#777">0<small>GOLD</small></div></div>
<div class="bar"><div style="background:linear-gradient(#ffcf4a,#e09a1a);color:#3a2408">LOCK IN</div><div style="background:linear-gradient(#9a6cf0,#6f43c9)">MAGIC POWERS</div><div style="background:linear-gradient(#4aa8ff,#2a78e0)">Free reroll</div></div>
<script>
const q=new URLSearchParams(location.search), sel=q.get('sel')||'arcbolt', low=q.get('low'); const have=low?1:12; document.getElementById('mg').textContent=have;
const I={bolt:'<svg viewBox="0 0 24 24"><path fill="#ff4b5a" d="M14 2 5 14h6l-2 8 10-13h-6z"/></svg>',miss:'<svg viewBox="0 0 24 24"><path fill="#ff9a3a" d="M3 21l9-9 1.5 1.5-9 9zM15 3l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/></svg>',coil:'<svg viewBox="0 0 24 24"><path fill="none" stroke="#ff5a7a" stroke-width="2.2" d="M12 12m-2 0a2 2 0 1 1 4 0a5 5 0 1 1-10 0a8 8 0 1 1 16 0"/></svg>',pot:'<svg viewBox="0 0 24 24"><path fill="#49e08a" d="M9 2h6v3l3 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9l3-4z"/></svg>',heal:'<svg viewBox="0 0 24 24"><path fill="#49e08a" d="M12 21C3 14 1 9 5 5c3-3 6-1 7 1 1-2 4-4 7-1 4 4 2 9-7 16z"/><path fill="#fff" d="M11 8h2v3h3v2h-3v3h-2v-3H8v-2h3z"/></svg>',heart:'<svg viewBox="0 0 24 24"><path fill="none" stroke="#ffcf4a" stroke-width="2" d="M12 21C3 14 1 9 5 5c3-3 6-1 7 1 1-2 4-4 7-1 4 4 2 9-7 16z"/></svg>'};
const P=[['arcbolt','Arc Bolt',I.bolt,2],['missile','Magic Missile',I.miss,1],['coil','Storm Coil',I.coil,1,'○○○○'],null,['potion','Potion',I.pot,0,null,'2 LEFT'],['heal','Heal',I.heal,2],['heart','Heart change',I.heart,3]];
document.getElementById('row').innerHTML=P.map(p=>!p?'<span class="sep"></span>':`<div class="t${p[0]===sel?' sel':''}${p[3]>have?' off':''}"><span class="ic">${p[2]}</span><span class="nm">${p[1]}</span>${p[4]?`<span class="pips">${p[4]}</span>`:''}<span class="cost${p[5]?' free':''}">${p[5]||(p[3]>have?`NEED ${p[3]-have}`:`<span class="tri"></span>${p[3]}`)}</span></div>`).join('');
const D={arcbolt:['A · Big move','Arc Bolt','Once a battle · recharge 3 magic','2 magic: 1d8 attack. +1 die per 2 more magic, max 5d8.',2]}[sel]||['','','','',0];
const pnl=document.getElementById('panel'); if(sel==='arcbolt') pnl.classList.add('first');
const short=D[4]>have;
pnl.innerHTML=`<span class="kick">${D[0]}</span><h2>${D[1]}</h2><span class="rule">${D[2]}</span><p>${D[3]}</p>
<div class="ctl"><div class="step"><button>−</button><b>2</b><button>+</button></div><button class="cast" ${short?'disabled style="background:#4a3f55"':''}><span class="tri" style="color:#fff;font-size:20px"></span><span><b>${short?`Need ${D[4]-have} more magic`:'Cast · 2 magic'}</b><small>${short?'Lock in your roll to add your magic dice':'Rolls 1d8 · 10 magic left'}</small></span></button></div>`;
</script></body></html>
