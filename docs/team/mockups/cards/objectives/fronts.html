<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Objective / Secret Objective FRONT template (Grok mockup for review)</title>
<!-- Grok art-director mockup, 24 Oct. Fronts in the same family as the approved T12 backs (black tooled leather, thin engraved border,
     small filigree corners). Objective = parchment + brass; Secret Objective = dark leather, crimson accent, silver text.
     Painted layers are text-free; every word and number is live HTML from the game's own data (js/g3/cards.js, js/secrets.js). -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15100c;padding:20px;font-family:Inter,sans-serif}
#cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.of{position:relative;width:var(--w,335px);aspect-ratio:3/4;container-type:inline-size;border-radius:4cqi;overflow:hidden;box-shadow:0 8px 20px #000c}
.of>img.fr{position:absolute;inset:0;width:100%;height:100%}
.in{position:absolute;left:12.5%;right:12.5%;top:9%;bottom:9%;display:flex;flex-direction:column;align-items:center;text-align:center}
.chip{font:800 3.1cqi/1 Inter;letter-spacing:.16em;padding:1.2cqi 2.8cqi;border-radius:9cqi;margin-top:1cqi}
.ttl{font:900 8.4cqi/1.04 Cinzel,serif;margin:2.6cqi 0 0;letter-spacing:.02em}
.vig{width:30cqi;aspect-ratio:1;border-radius:50%;margin:3cqi 0 2.4cqi;background-size:cover;flex:0 0 auto}
.goal{font:700 6cqi/1.28 Inter;flex:1 1 auto;display:flex;align-items:center;padding:0 1cqi}
.terms{width:100%;display:flex;flex-direction:column;gap:1.4cqi;margin-bottom:1cqi}
.t{display:flex;align-items:center;justify-content:space-between;gap:2cqi;padding:1.5cqi 2.6cqi;border-radius:1.6cqi;font:600 3.6cqi/1.2 Inter;text-align:left}
.t small{font:800 2.7cqi/1 Inter;letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto}
.t span{display:flex;align-items:center;gap:1.2cqi;justify-content:flex-end;text-align:right}.t b{font:800 4.6cqi/1 Inter}
.t em{font-style:normal;font-size:3cqi;flex-basis:100%;text-align:right;opacity:.85}.t span{flex-wrap:wrap}.of.tight .vig{width:18cqi;margin:2cqi 0 1.4cqi}.of.tight .goal{font-size:5.4cqi}.of.tight .t{padding:1.1cqi 2.4cqi}
.t svg{width:4.4cqi;height:4.4cqi;flex:0 0 auto;filter:drop-shadow(0 .2cqi .2cqi #0008)}
/* Objective: parchment, dark ink, brass */
.obj .chip{background:#3a2610;color:#f0d89a;box-shadow:inset 0 0 0 .35cqi #b08a4a}
.obj .ttl{color:#2a1606;text-shadow:0 .3cqi 0 #fff5}
.obj .vig{background-image:url(vig-compass.webp);box-shadow:0 0 0 .7cqi #9a7434,0 .8cqi 1.6cqi #0006}
.obj .goal{color:#2e1c0a}
.obj .t{background:#f6e8c4cc;color:#3a2410;box-shadow:inset 0 0 0 .3cqi #a8844a88}.obj .t small{color:#7a5420}.obj .t.bad{background:#e8d2b0aa}
/* Secret Objective: dark, crimson accent, silver text */
.sec .chip{background:#5a0c12;color:#f4eee6;box-shadow:inset 0 0 0 .35cqi #c8202a}
.sec .ttl{color:#efeae2;text-shadow:0 .4cqi .6cqi #000}
.sec .vig{background-image:url(vig-seal.webp);box-shadow:0 0 0 .7cqi #8a1018,0 .8cqi 1.6cqi #000a}
.sec .goal{color:#d8d4cc}
.sec .t{background:#ffffff10;color:#e6e2da;box-shadow:inset 0 0 0 .3cqi #9a1a2288}.sec .t small{color:#d06a70}
.hand{display:flex;justify-content:center;gap:8px;margin-top:24px}.hand .of{--w:120px}
.pair{display:flex;gap:20px;justify-content:center;margin-top:24px}.pair img.bk{width:335px;aspect-ratio:3/4;border-radius:13px;box-shadow:0 8px 20px #000c}
</style>
<body>
<div id="cards"></div><div class="hand" id="hand"></div>
<div class="pair" id="pairO"><img class="bk" src="../../backs/back-objective.webp" alt=""></div>
<div class="pair" id="pairS"><img class="bk" src="../../backs/back-secret-objective.webp" alt=""></div>
<script type="module">
import { objectiveData, secretData, ico } from '../../../../../js/g3/cards.js';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const g = (n) => `${ico('gold')}<b>${n}</b>`;
// type chip: Objectives are today's Bonus Goals; Secret Objective chips name the internal kind (PROPOSED words, see README)
const CHIP = { cover: 'SECRET GOAL', rival: 'RIVALRY', challenge: 'CHALLENGE', offer: 'WAGER', bribe: 'BRIBE' };
function objective(id, { free = false } = {}) { const d = objectiveData(id); if (free) { d.stake = 0; d.free = true; }
  const terms = d.stake ? `<div class="t"><small>Stake</small><span>${g(d.stake)} gold, paid now</span></div><div class="t"><small>Reward</small><span>${g(d.back)} if done and won</span></div><div class="t bad"><small>If not</small><span>stake lost</span></div>`
    : `<div class="t"><small>Stake</small><span>none, a free try</span></div><div class="t"><small>Reward</small><span>${g(d.back)} if done and won</span></div>`;
  return card('obj', 'BONUS CHALLENGE', d.name, d.rule, terms, id + (free ? '-free' : '')); }
function secret(id) { const d = secretData(id); const k = d.mode === 'offer' ? 'offer' : d.kind; let terms;
  if (d.terms) { const t = d.terms; terms = `<div class="t"><small>Done + won</small><span>${g(t.win)}</span></div><div class="t"><small>Team defeated</small><span>pay ${g(t.fail)} <em>+${t.crooks} if all bribes taken</em></span></div><div class="t"><small>Decline</small><span>Honor +${t.honor[0]} (+${t.honor[1]} if defeated)</span></div>`; }
  else terms = d.stakes.map((s) => { const m = s.match(/^Win (\d+) gold$/); return `<div class="t"><small>Reward</small><span>${m ? g(m[1]) + ' gold' : esc(s.replace(/^Win: /, ''))}</span></div>`; }).join('');
  return card('sec' + (d.terms ? ' tight' : ''), CHIP[k], d.name, d.rule, terms, id); }
function card(cls, chip, name, rule, terms, key) {
  return `<article class="of ${cls}" data-k="${key}"><img class="fr" src="front-${cls.startsWith('obj') ? 'objective' : 'secret-objective'}-frame.webp" alt=""><div class="in">
  <div class="chip">${chip}</div><h2 class="ttl">${esc(name)}</h2><div class="vig"></div><p class="goal">${esc(rule)}</p><div class="terms">${terms}</div></div></article>`; }
const list = [objective('nopotion'), objective('block40'), objective('deal50', { free: true }), secret('thrice'), secret('slacker'), secret('goldrush')];
document.getElementById('cards').innerHTML = list.join('');
document.getElementById('hand').innerHTML = list.join('');
document.getElementById('pairO').insertAdjacentHTML('afterbegin', objective('nopotion'));
document.getElementById('pairS').insertAdjacentHTML('afterbegin', secret('slacker'));
document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = 1), 200));
</script>
