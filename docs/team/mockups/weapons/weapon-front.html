<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONCEPT · Weapon front</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
.pg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px 16px;background:radial-gradient(90% 50% at 50% 35%,#221a14,#0b0a0a 65%,#04060d)}
.concept{padding:4px 10px;border-radius:4px;font:800 .6rem var(--font-display);letter-spacing:.2em;background:#b3261e;color:#fff}
.tc{position:relative;width:min(340px,calc(100vw - 24px));aspect-ratio:3/4;container-type:inline-size;filter:drop-shadow(0 16px 26px #000c)}
.tc>*{position:absolute}.fr{inset:0;width:100%;height:100%}
.win{left:13.4%;top:9.6%;width:73%;height:44.6%;overflow:hidden;border-radius:6% 6% 0 0/10% 10% 0 0;background:#1a120c url(art/scene-forge.webp) center 60%/cover}
.win::after{content:'';position:absolute;inset:0;background:radial-gradient(55% 55% at 55% 55%,transparent 40%,#0008)}
.win img{position:absolute;height:88%;left:50%;top:6%;transform:translateX(-50%);filter:drop-shadow(0 12px 10px #000b) drop-shadow(0 0 14px #ffe6a855)}
.name{left:14%;right:14%;top:56.2%;height:4.9%;display:grid;place-items:center;font:700 6.6cqi/1 var(--font-story);color:#f2e6cc;text-shadow:0 1px 0 #000,0 0 6px #000}
.meta{left:14%;right:14%;top:63%;display:flex;justify-content:center;gap:1.6cqi}
.meta span{padding:.6cqi 2.2cqi;border-radius:99px;font:800 3.3cqi var(--font-display);color:#2a1404;background:#fff6e2cc;border:1px solid #78460a66}
.meta .ag{background:linear-gradient(180deg,#f4f6fa,#c3cde0);border-color:#8a94a8}
.faces{left:17%;right:17%;top:69.4%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.8cqi}
.fc{height:10.4cqi;border-radius:2cqi;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqi;font:800 5.8cqi/1 var(--font-display);box-shadow:inset 0 1px 0 #fff3,0 2px 3px #0006}
.fc.r{background:linear-gradient(180deg,#4a161d,#2e0c12);border:1.5px solid #d0414b;color:#ffc0c0}.fc.b{background:linear-gradient(180deg,#143c5e,#0c2338);border:1.5px solid #3aa4ff;color:#cfeaff}
.fc i{display:flex;align-items:center;gap:.3cqi;font:800 3.3cqi var(--font-display);font-style:normal}.fc svg{width:3.3cqi;height:3.3cqi}
svg .p{fill:currentColor}.t-pierce{color:#ff8a1a}.t-heal{color:#38e87a}.t-magic{color:#b46cff}
.cn{width:7.6%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.cn svg{width:72%;height:72%;filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 1px 1px #000)}
.c1{left:4.7%;top:2.3%}.c2{right:4.9%;top:2.3%}.c3{left:4.7%;bottom:2.2%}.c4{right:4.9%;bottom:2.2%}
.under{width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px}
.legend{margin:0;display:flex;justify-content:center;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:#d8cbb0}.legend b{display:inline-flex;align-items:center;gap:4px;font-weight:600}.legend svg{width:12px;height:12px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px}.sw.r{background:#d0414b}.sw.b{background:#3aa4ff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts .btn{height:54px;line-height:1.1}.acts .btn small{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:none;opacity:.85}
</style></head><body><main class="pg"><div class="concept">CONCEPT MOCKUP · not in game</div>
<div class="tc">
 <div class="win"><img src="art/dagger-512.webp" alt="Dagger"></div>
 <img class="fr" src="art/front-frame.webp" alt="">
 <span class="cn c1 t-pierce"><svg viewBox="0 0 24 24"><path class="p" d="M12 2 L21 11.2 H15.2 V22 H8.8 V11.2 H3 Z"/></svg></span><span class="cn c2 t-heal"><svg viewBox="0 0 24 24"><path class="p" d="M9.4 3 H14.6 V9.4 H21 V14.6 H14.6 V21 H9.4 V14.6 H3 V9.4 H9.4 Z"/></svg></span><span class="cn c3 t-heal"><svg viewBox="0 0 24 24"><path class="p" d="M9.4 3 H14.6 V9.4 H21 V14.6 H14.6 V21 H9.4 V14.6 H3 V9.4 H9.4 Z"/></svg></span><span class="cn c4 t-pierce"><svg viewBox="0 0 24 24"><path class="p" d="M12 2 L21 11.2 H15.2 V22 H8.8 V11.2 H3 Z"/></svg></span>
 <div class="name">Dagger</div>
 <div class="meta"><span class="ag">Silver</span><span>d6</span><span>6 battles left</span></div>
 <div class="faces"><div class="fc r">2</div><div class="fc b">2</div><div class="fc r">3</div><div class="fc r">3<i class="t-heal"><svg viewBox="0 0 24 24"><path class="p" d="M9.4 3 H14.6 V9.4 H21 V14.6 H14.6 V21 H9.4 V14.6 H3 V9.4 H9.4 Z"/></svg>1</i></div><div class="fc r">4<i class="t-pierce"><svg viewBox="0 0 24 24"><path class="p" d="M12 2 L21 11.2 H15.2 V22 H8.8 V11.2 H3 Z"/></svg>1</i></div><div class="fc r">5<i class="t-heal"><svg viewBox="0 0 24 24"><path class="p" d="M9.4 3 H14.6 V9.4 H21 V14.6 H14.6 V21 H9.4 V14.6 H3 V9.4 H9.4 Z"/></svg>2</i></div></div>
</div>
<div class="under"><p class="legend"><b><i class="sw r"></i>Attack</b><b><i class="sw b"></i>Block</b><b class="t-pierce"><svg viewBox="0 0 24 24"><path class="p" d="M12 2 L21 11.2 H15.2 V22 H8.8 V11.2 H3 Z"/></svg><span style="color:#d8cbb0">Pierce</span></b><b class="t-heal"><svg viewBox="0 0 24 24"><path class="p" d="M9.4 3 H14.6 V9.4 H21 V14.6 H14.6 V21 H9.4 V14.6 H3 V9.4 H9.4 Z"/></svg><span style="color:#d8cbb0">Heal</span></b></p><div class="acts"><div class="btn go">Take</div><div class="btn no">Sell<small>for 27 gold</small></div></div></div>
</main></body></html>
